<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Search | Algoritmos de Búsqueda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="glass-bg"></div>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="glow-text">BÚSQUEDAS</h1>
        </header>

        <section class="config-card">
            <div class="algorithm-selector">
                <label for="algorithm">Algoritmo</label>
                <select id="algorithm">
                    <option value="dfs">Búsqueda en Profundidad (DFS)</option>
                    <option value="ucs">Costo Uniforme (UCS)</option>
                    <option value="heuristica">Búsqueda Heurística</option>
                </select>
            </div>

            <div class="inputs-grid" id="inputs-container">
                <!-- Los campos se generarán dinámicamente aquí -->
            </div>

            <button id="solve-btn" class="solve-btn">
                <span>EJECUTAR ALGORITMO</span>
                <div class="btn-glow"></div>
            </button>
        </section>

        <section class="results-section">
            <div id="loader" class="loader hidden"></div>
            <div id="error-msg" class="error-msg hidden"></div>

            <div id="results-content" class="results-content hidden">
                <h3>Resultado de la Búsqueda</h3>
                <div class="stats-bar">
                    <div class="stat-item" id="stat-steps">
                        <span class="label">Pasos:</span>
                        <span class="value">0</span>
                    </div>
                    <div class="stat-item hidden" id="stat-cost-container">
                        <span class="label">Costo Total:</span>
                        <span class="value" id="stat-cost">0</span>
                    </div>
                </div>

                <div class="path-visualizer" id="path-visualizer">
                    <!-- Los pasos se insertarán aquí -->
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
