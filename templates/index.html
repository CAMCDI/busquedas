<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÚSQUEDAS | Pro Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <main class="container">
        <header>
            <h1 class="glow-text">BÚSQUEDAS</h1>
        </header>

        <section class="config-card">
            <div class="selection-group">
                <label>Algoritmos a comparar:</label>
                <div id="algo-chips" class="chip-container">
                    <div class="algo-chip active" data-algo="dfs">DFS Profundidad</div>
                    <div class="algo-chip active" data-algo="bfs">BFS Amplitud</div>
                    <div class="algo-chip active" data-algo="heuristic">Heurística</div>
                </div>
            </div>

            <div id="puzzle-inputs">
                <div class="inputs-grid">
                    <div class="input-group">
                        <label for="start-state">Estado Inicial</label>
                        <input type="text" id="start-state" placeholder="Ej: 4,2,3,1">
                    </div>
                    <div class="input-group">
                        <label for="goal-state">Estado Objetivo</label>
                        <input type="text" id="goal-state" placeholder="Ej: 1,2,3,4">
                    </div>
                </div>
            </div>

            <button id="solve-btn" class="solve-btn">COMPARAR ALGORITMOS</button>
        </section>

        <section id="results-section" class="hidden">
            <div class="results-grid">
                <!-- DFS Results -->
                <div class="results-column" id="dfs-results">
                    <h3>DFS (Profundidad)</h3>
                    <div class="stats-compact"></div>
                    <div class="path-visualizer-vertical"></div>
                </div>

                <!-- BFS Results -->
                <div class="results-column" id="bfs-results">
                    <h3>BFS (Amplitud)</h3>
                    <div class="stats-compact"></div>
                    <div class="path-visualizer-vertical"></div>
                </div>

                <!-- Heuristic Results -->
                <div class="results-column" id="heuristic-results">
                    <h3>Heurística</h3>
                    <div class="stats-compact"></div>
                    <div class="path-visualizer-vertical"></div>
                </div>
            </div>
        </section>

        <div id="loader" class="loader hidden"></div>
        <div id="error-container" class="error-msg hidden"></div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
